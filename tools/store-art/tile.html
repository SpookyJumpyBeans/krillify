<!doctype html>
<!-- Store promo tile, 440x280. -->
<meta charset="utf-8">
<title>Krillify promo tile</title>
<style>
  @font-face{font-family:VT323;src:url(/ext/fonts/VT323.woff2) format("woff2")}
  html,body{margin:0;width:440px;height:280px;overflow:hidden}
  body{font-family:VT323,monospace;color:#e8f1ff;background:radial-gradient(130% 110% at 20% 0,#0d3a66 0,#071a33 60%,#050a14 100%);display:flex;align-items:center;gap:22px;padding:0 34px;box-sizing:border-box;-webkit-font-smoothing:none}
  img{width:128px;height:128px;flex:none}
  h1{font-weight:400;font-size:52px;letter-spacing:7px;margin:0}
  h1 span{color:#4de3ff;text-shadow:0 0 14px rgba(77,227,255,.55)}
  p{margin:6px 0 0;font-size:24px;line-height:1.05;color:#7d93b8;letter-spacing:1px}
</style>
<body>
  <img src="/ext/icons/icon-128.png" alt="">
  <div><h1>KRILL<span>IFY</span></h1><p>Deep cuts for<br>Puffer Party</p></div>
</body>
